services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rps
      POSTGRES_PASSWORD: rps
      POSTGRES_DB: rps
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: